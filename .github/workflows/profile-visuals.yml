name: build profile dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/dashboard.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow

      - run: python scripts/generate_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh profile dashboard"
          file_pattern: "assets/dashboard.gif"
