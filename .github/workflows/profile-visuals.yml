name: build pixel profile

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/profile.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pixel-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow

      - run: python scripts/generate_pixel_profile.py

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh pixel profile animation"
          file_pattern: "assets/profile.gif"
