name: build profile visuals

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/vedant.gif"
      - "assets/project-software.gif"
      - "assets/pixel-hello.gif"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow numpy opencv-python-headless

      - run: python scripts/generate_vedant_gif.py
      - run: python scripts/generate_profile_visuals.py

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh animated profile visuals"
          file_pattern: "assets/*.gif"
