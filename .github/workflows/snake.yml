name: contribution snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vedanthaha
          outputs: |
            assets/github-snake.svg?palette=github-dark&color_snake=%23B7D79A
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23B7D79A

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh contribution snake"
          file_pattern: "assets/github-snake*.svg"
