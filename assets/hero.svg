<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs>
  <filter id="liquid" x="-25%" y="-45%" width="150%" height="190%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="9" result="noise">
      <animate attributeName="baseFrequency" dur="5.8s" values="0.012 0.035;0.026 0.010;0.009 0.028;0.012 0.035" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" dur="5.8s" values="0;46;18;54;0" repeatCount="indefinite"/>
    </feDisplacementMap>
  </filter>
  <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
    <feGaussianBlur stdDeviation="0.25"/>
  </filter>
</defs>
<rect width="1200" height="500" fill="#111111"/>
<g filter="url(#liquid)">
  <text x="600" y="315"
        text-anchor="middle"
        font-family="Inter,Helvetica,Arial,sans-serif"
        font-size="190"
        font-weight="500"
        letter-spacing="-10"
        fill="#F7F7F5">vedant</text>
</g>
</svg>